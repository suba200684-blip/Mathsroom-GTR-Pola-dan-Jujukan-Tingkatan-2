cy+35,12);if(boost>0)text('PECUTAN TAMBAHAN!',480,70,30,'#8ff9ff');}window.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){e.preventDefault();keys[e.key]=true}});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>keys={});document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[b.dataset.k]=true};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.k]=false});requestAnimationFrame(frame);</script>
